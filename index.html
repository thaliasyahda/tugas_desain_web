<!DOCTYPE html>
<html>
    <head>
        <title>Latihan Web</title>
         <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <style>
         body {
            background-color: rgb(215, 219, 242);
            font-family: 'Roboto', sans-serif;
            margin: auto;
            width: auto;

        }

        .kepala {
            padding: 10px;
            text-align: center;
            background-color: rgb(146, 153, 200);
            border-bottom: 2px solid rgb(85, 93, 146);
            margin-bottom: 20px;

        }

        .menu {
            background-color: rgb(177, 184, 225);
            text-align: center;
            padding: 8px;
            margin-bottom: 20px;
            border-radius: 8px;

        }

        .menu ul li {
            display: inline;
            margin-right: 15px;
            padding: 8px;

        }

        .menu a {
            text-decoration: none;
            color:black;
            display: inline-block;
            padding: 5px;
        }

        .menu a:hover {
            background-color:rgb(130, 137, 180);
            transition: .2s ease-in-out;
            border-radius: 8px;
        }

        .samping {
            width: 25%;
            padding: 15px;
            margin-bottom: 20px;
            box-sizing:border-box;
            text-align: center;
            float: left;
            background-color: white;
            border: 1px solid rgb(177, 184, 225);
            border-radius: 8px;
        }

        .samping .profil {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }

        .samping h3 {
            margin-top: 0;
            padding-top: 20px;
        }

        .tengah {
            margin-left: 25%;
            margin-bottom: 20px;
            padding: 15px;
            min-height: 375px;
            background-color: white;
            border: 1px solid rgb(177, 184, 225);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .kaki {
            background-color: rgb(177, 184, 225);
            text-align: center;
            padding: 15px;
            clear: both;
            margin-top: 20px;
    
        }
    </style>
    <body>
         <div class="kepala">
            <h1>Thalia Syahda Zildawati</h1>
        </div>

        <div class="menu">
            <ul>
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Profil</a></li>
                <li><a href="#">Artikel</a></li>
                <li><a href="#">Porto</a></li>
                <li><a href="#">Kontak</a></li>
            </ul>
        </div>

        <div class="samping">
            <h3>Tentang Penulis</h3>
            <img src="profile.jpg" class="profil">
            <p>Hallo! Saya Thalia Syahda Zildawati. Saya merupakan mahasiswa semester 3 Program Studi Pendidikan Teknologi Informasi dan Komunikasi di Universitas Muhammadiyah Kuningan.</p>
        </div>

        <div class="tengah">
            <h3>Konten</h3>
        </div>

        <div class="kaki">
            <h3>Footer</h3>
        </div>
    </body>
</html>
